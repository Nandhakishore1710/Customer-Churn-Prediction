<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Customer Churn Prediction</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        select {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }

        .button-container {
            text-align: center;
            margin-top: 30px;
        }

        button {
            padding: 12px 30px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
        }

        .result {
            margin-top: 30px;
            padding: 20px;
            text-align: center;
            border-radius: 8px;
        }

        .result h2 {
            margin-bottom: 10px;
        }

        .result p {
            font-size: 18px;
        }

    </style>

</head>


<body>

<div class="container">

    <h1>Customer Churn Prediction</h1>


    <form action="/predict" method="POST">

        <div class="form-grid">


            <!-- Gender -->
            <div class="form-group">
                <label>Gender</label>

                <select name="gender" required>

                    <option value="Male">Male</option>

                    <option value="Female">Female</option>

                </select>

            </div>


            <!-- Senior Citizen -->
            <div class="form-group">
                <label>Senior Citizen</label>

                <select name="SeniorCitizen" required>

                    <option value="0">No</option>

                    <option value="1">Yes</option>

                </select>

            </div>


            <!-- Partner -->
            <div class="form-group">
                <label>Partner</label>

                <select name="Partner" required>

                    <option value="Yes">Yes</option>

                    <option value="No">No</option>

                </select>

            </div>


            <!-- Dependents -->
            <div class="form-group">
                <label>Dependents</label>

                <select name="Dependents" required>

                    <option value="Yes">Yes</option>

                    <option value="No">No</option>

                </select>

            </div>


            <!-- Tenure -->
            <div class="form-group">
                <label>Tenure (Months)</label>

                <input
                    type="number"
                    name="tenure"
                    min="0"
                    required
                >

            </div>


            <!-- Phone Service -->
            <div class="form-group">
                <label>Phone Service</label>

                <select name="PhoneService" required>

                    <option value="Yes">Yes</option>

                    <option value="No">No</option>

                </select>

            </div>


            <!-- Multiple Lines -->
            <div class="form-group">
                <label>Multiple Lines</label>

                <select name="MultipleLines" required>

                    <option value="No">No</option>

                    <option value="Yes">Yes</option>

                    <option value="No phone service">
                        No phone service
                    </option>

                </select>

            </div>


            <!-- Internet Service -->
            <div class="form-group">
                <label>Internet Service</label>

                <select name="InternetService" required>

                    <option value="DSL">DSL</option>

                    <option value="Fiber optic">Fiber optic</option>

                    <option value="No">No</option>

                </select>

            </div>


            <!-- Online Security -->
            <div class="form-group">
                <label>Online Security</label>

                <select name="OnlineSecurity" required>

                    <option value="No">No</option>

                    <option value="Yes">Yes</option>

                    <option value="No internet service">
                        No internet service
                    </option>

                </select>

            </div>


            <!-- Online Backup -->
            <div class="form-group">
                <label>Online Backup</label>

                <select name="OnlineBackup" required>

                    <option value="No">No</option>

                    <option value="Yes">Yes</option>

                    <option value="No internet service">
                        No internet service
                    </option>

                </select>

            </div>


            <!-- Device Protection -->
            <div class="form-group">
                <label>Device Protection</label>

                <select name="DeviceProtection" required>

                    <option value="No">No</option>

                    <option value="Yes">Yes</option>

                    <option value="No internet service">
                        No internet service
                    </option>

                </select>

            </div>


            <!-- Tech Support -->
            <div class="form-group">
                <label>Tech Support</label>

                <select name="TechSupport" required>

                    <option value="No">No</option>

                    <option value="Yes">Yes</option>

                    <option value="No internet service">
                        No internet service
                    </option>

                </select>

            </div>


            <!-- Streaming TV -->
            <div class="form-group">
                <label>Streaming TV</label>

                <select name="StreamingTV" required>

                    <option value="No">No</option>

                    <option value="Yes">Yes</option>

                    <option value="No internet service">
                        No internet service
                    </option>

                </select>

            </div>


            <!-- Streaming Movies -->
            <div class="form-group">
                <label>Streaming Movies</label>

                <select name="StreamingMovies" required>

                    <option value="No">No</option>

                    <option value="Yes">Yes</option>

                    <option value="No internet service">
                        No internet service
                    </option>

                </select>

            </div>


            <!-- Contract -->
            <div class="form-group">
                <label>Contract</label>

                <select name="Contract" required>

                    <option value="Month-to-month">
                        Month-to-month
                    </option>

                    <option value="One year">
                        One year
                    </option>

                    <option value="Two year">
                        Two year
                    </option>

                </select>

            </div>


            <!-- Paperless Billing -->
            <div class="form-group">
                <label>Paperless Billing</label>

                <select name="PaperlessBilling" required>

                    <option value="Yes">Yes</option>

                    <option value="No">No</option>

                </select>

            </div>


            <!-- Payment Method -->
            <div class="form-group">
                <label>Payment Method</label>

                <select name="PaymentMethod" required>

                    <option value="Electronic check">
                        Electronic check
                    </option>

                    <option value="Mailed check">
                        Mailed check
                    </option>

                    <option value="Bank transfer (automatic)">
                        Bank transfer (automatic)
                    </option>

                    <option value="Credit card (automatic)">
                        Credit card (automatic)
                    </option>

                </select>

            </div>


            <!-- Monthly Charges -->
            <div class="form-group">
                <label>Monthly Charges</label>

                <input
                    type="number"
                    name="MonthlyCharges"
                    step="0.01"
                    min="0"
                    required
                >

            </div>


            <!-- Total Charges -->
            <div class="form-group">
                <label>Total Charges</label>

                <input
                    type="number"
                    name="TotalCharges"
                    step="0.01"
                    min="0"
                    required
                >

            </div>


        </div>


        <!-- Predict Button -->
        <div class="button-container">

            <button type="submit">
                Predict Churn
            </button>

        </div>

    </form>


    <!-- Prediction Result -->

    {% if prediction is defined %}

    <div class="result">

        <h2>Prediction Result</h2>

        <h2>{{ result }}</h2>

        <p>
            Churn Probability:
            <strong>{{ probability }}%</strong>
        </p>

    </div>

    {% endif %}


</div>

</body>

</html>
